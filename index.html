<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人网站</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --accent:#2563eb; --paper:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.7; }
    .wrap { width:min(920px, calc(100% - 32px)); margin:0 auto; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:22px 0; }
    .logo { font-weight:800; letter-spacing:.04em; }
    nav a { color:var(--muted); text-decoration:none; margin-left:20px; font-size:.95rem; }
    nav a:hover { color:var(--accent); }
    .hero { display:grid; grid-template-columns:1.5fr 1fr; gap:40px; align-items:center; padding:84px 0 72px; }
    .eyebrow { color:var(--accent); font-weight:700; margin:0 0 12px; }
    h1 { font-size:clamp(2.3rem, 7vw, 4.5rem); line-height:1.1; margin:0 0 18px; }
    h2 { font-size:1.8rem; margin:0 0 18px; }
    .lead { color:var(--muted); font-size:1.15rem; max-width:550px; }
    .button { display:inline-block; margin-top:18px; padding:10px 18px; border-radius:10px; color:white; background:var(--accent); text-decoration:none; font-weight:700; }
    .portrait { width:220px; height:220px; margin:auto; display:grid; place-items:center; border-radius:50%; color:#1e3a8a; background:#dbeafe; font-size:4.5rem; font-weight:800; }
    section { padding:48px 0; border-top:1px solid #e5e7eb; }
    .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .card { padding:22px; border:1px solid #e5e7eb; border-radius:14px; background:white; }
    .card h3 { margin:0 0 8px; }
    .card p, .contact p { color:var(--muted); margin:0; }
    footer { padding:36px 0 52px; color:var(--muted); font-size:.9rem; }
    @media (max-width:680px) { nav { align-items:flex-start; } nav a { margin-left:10px; } .hero { grid-template-columns:1fr; padding:52px 0 48px; } .portrait { width:150px; height:150px; font-size:3rem; } .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div class="logo">我的小站</div>
      <div><a href="#about">关于我</a><a href="#projects">作品</a><a href="#contact">联系</a></div>
    </nav>

    <main>
      <section class="hero" style="border-top:0;">
        <div>
          <p class="eyebrow">你好，很高兴认识你</p>
          <h1>我是 onthe </h1>
          <a class="button" href="Personal_Resume.pdf" target="_blank">
            查看我的简历
          </a>
          <p class="lead">我一直在进步。</p>
          <a class="button" href="#projects">看看我的作品</a>
        </div>
        <div class="portrait" aria-label="头像占位"></div>
      </section>

      <section id="about">
        <h2>关于我</h2>
        <p class="lead">充满好奇，保持进步。</p>
      </section>

      <section id="projects">
        <h2>我的作品</h2>
        <div class="cards">
          <article class="card"><h3>作品一</h3><p>用一句话介绍你的第一个项目。</p></article>
          <article class="card"><h3>作品二</h3><p>可以放学习成果、摄影或其他创作。</p></article>
          <article class="card"><h3>正在进行</h3><p>记录你现在想完成的一件事。</p></article>
        </div>
      </section>

      <section id="contact" class="contact">
        <h2>联系我</h2>
        <p>邮箱：<a href="mailto:onthe_713@outlook.com">onthe_713@outlook.com</a> / <a href="mailto:1822065895@qq.com">1822065895@qq.com</a></p>
      </section>
    </main>

    <footer>© 2026 onthe · 用好奇心持续创作</footer>
  </div>
</body>
</html>
